<!DOCTYPE html>
<!--
  SISTEMA DE REGISTRO DE ASISTENCIA Y CALIFICACIONES
  Interfaz (HTML + CSS + JS) para Google Apps Script
  Desarrollador: Mtro. Raúl Dionicio
-->
<html lang="es" data-bs-theme="light">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Asistencia y Calificaciones</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body{background:var(--bs-tertiary-bg)}
  #barra{position:fixed;top:0;left:0;right:0;height:3px;z-index:3000;display:none;background:linear-gradient(90deg,var(--bs-primary),var(--bs-info),var(--bs-primary));background-size:200% 100%;animation:barra 1s linear infinite}
  @keyframes barra{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){#barra{animation:none}}
  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .login-card{width:100%;max-width:460px}
  .logo-img{max-height:84px;max-width:180px;object-fit:contain}
  .menu-link{display:flex;align-items:center;gap:.65rem;padding:.6rem .85rem;border-radius:.5rem;color:var(--bs-body-color);text-decoration:none;margin-bottom:2px}
  .menu-link:hover{background:var(--bs-secondary-bg)}
  .menu-link.active{background:var(--bs-primary);color:#fff}
  @media(min-width:992px){
    #sidebar{flex:0 0 260px;width:260px!important;position:sticky!important;top:56px;align-self:flex-start;height:calc(100vh - 56px)!important;
      background:var(--bs-body-bg)!important;border-right:1px solid var(--bs-border-color)!important;overflow-y:auto}
  }
  .tabla-cal th,.tabla-cal td{white-space:nowrap;vertical-align:middle;text-align:center}
  .tabla-cal .nm{text-align:left;position:sticky;left:0;z-index:1;background:var(--bs-body-bg);min-width:200px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  .tabla-cal thead th{background:var(--bs-primary);color:#fff;border-color:rgba(255,255,255,.35)}
  .tabla-cal thead th.nm{z-index:2}
  .tabla-cal input.calif{width:74px;text-align:center;margin:auto}
  .tabla-cal th[role=button]{cursor:pointer;text-decoration:underline dotted}
  .as-row .btn{min-width:46px}
  .nota{font-size:.82rem}
  .rep-wrap{background:#fff;border:1px solid var(--bs-border-color);border-radius:.5rem;overflow:auto}
  .modal-body .form-text{font-size:.8rem}
  @media print{
    .no-print,#sidebar,nav.navbar,footer{display:none!important}
    body{background:#fff!important}
    #viewGuest .card{border:0!important;box-shadow:none!important}
  }
</style>
</head>
<body>
<div id="barra"></div>
<div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:3100"></div>

<!-- ============================ ACCESO ============================ -->
<section id="viewLogin" class="login-wrap">
  <div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-outline-secondary btn-sm" onclick="alternarTema()" title="Cambiar tema claro / oscuro" aria-label="Cambiar tema"><i class="ico-tema bi bi-moon-stars-fill"></i></button>
  </div>
  <div class="login-card">
    <div class="text-center mb-3">
      <img id="loginLogo" class="logo-img mb-2" alt="Logotipo" style="display:none">
      <h1 class="h4 mb-0" id="loginInst">Sistema de Asistencia y Calificaciones</h1>
      <div class="text-body-secondary small" id="loginEnc"></div>
    </div>
    <div class="card shadow-sm">
      <div class="card-header p-0">
        <ul class="nav nav-tabs nav-fill border-0" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pLogin" type="button"><i class="bi bi-person-lock"></i> Personal</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pInvitado" type="button"><i class="bi bi-search"></i> Consulta de calificaciones</button></li>
        </ul>
      </div>
      <div class="card-body tab-content">
        <form id="pLogin" class="tab-pane fade show active" onsubmit="entrar(event)" autocomplete="on">
          <div class="mb-3"><label class="form-label" for="lu">Usuario</label>
            <input id="lu" class="form-control" autocomplete="username" autocapitalize="none" required></div>
          <div class="mb-3"><label class="form-label" for="lp">Contraseña</label>
            <input id="lp" type="password" class="form-control" autocomplete="current-password" required></div>
          <div id="loginErr" class="alert alert-danger py-2 d-none"></div>
          <button class="btn btn-primary w-100" id="btnLogin"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</button>
        </form>
        <form id="pInvitado" class="tab-pane fade" onsubmit="consultar(event)">
          <p class="small text-body-secondary">Escribe la matrícula del estudiante y su clave de consulta (la proporciona el docente).</p>
          <div class="mb-3"><label class="form-label" for="gm">Matrícula</label>
            <input id="gm" class="form-control" autocapitalize="characters" required></div>
          <div class="mb-3"><label class="form-label" for="gc">Clave de consulta</label>
            <input id="gc" class="form-control" inputmode="numeric" maxlength="12" required></div>
          <div id="gErr" class="alert alert-danger py-2 d-none"></div>
          <button class="btn btn-success w-100"><i class="bi bi-search"></i> Consultar calificaciones</button>
        </form>
      </div>
    </div>
    <p class="text-center small text-body-secondary mt-3 mb-0">Desarrollado por <strong>Mtro. Raúl Dionicio</strong></p>
  </div>
</section>

<!-- ============================ INVITADO ============================ -->
<section id="viewGuest" class="container py-4" style="display:none">
  <div class="d-flex justify-content-end gap-2 mb-3 no-print">
    <button class="btn btn-outline-secondary btn-sm" onclick="alternarTema()" aria-label="Cambiar tema"><i class="ico-tema bi bi-moon-stars-fill"></i></button>
    <button class="btn btn-outline-primary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
    <button class="btn btn-secondary btn-sm" onclick="salirInvitado()"><i class="bi bi-arrow-left"></i> Nueva consulta</button>
  </div>
  <div id="guestBody"></div>
  <p class="text-center small text-body-secondary mt-4">Desarrollado por <strong>Mtro. Raúl Dionicio</strong></p>
</section>

<!-- ============================ APLICACIÓN ============================ -->
<section id="viewApp" style="display:none">
  <nav class="navbar bg-primary sticky-top" data-bs-theme="dark" style="height:56px">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Menú"><i class="bi bi-list fs-5"></i></button>
        <span class="navbar-brand mb-0 h6 text-truncate" style="max-width:55vw"><i class="bi bi-mortarboard-fill"></i> <span id="navInst">Asistencia y Calificaciones</span></span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm" onclick="alternarTema()" title="Tema claro / oscuro" aria-label="Cambiar tema"><i class="ico-tema bi bi-moon-stars-fill"></i></button>
        <div class="dropdown">
          <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle"></i> <span class="d-none d-sm-inline" id="navUser"></span></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header" id="navRol"></h6></li>
            <li><button class="dropdown-item" onclick="formPass(false)"><i class="bi bi-key"></i> Cambiar contraseña</button></li>
            <li><button class="dropdown-item" onclick="acerca()"><i class="bi bi-info-circle"></i> Acerca de</button></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger" onclick="salir()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
  <div class="d-flex">
    <aside id="sidebar" class="offcanvas-lg offcanvas-start" tabindex="-1" aria-labelledby="sbTit">
      <div class="offcanvas-header"><h5 class="offcanvas-title" id="sbTit">Menú</h5><button class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Cerrar"></button></div>
      <div class="offcanvas-body flex-column p-2"><nav id="menu" class="w-100"></nav>
        <div class="mt-auto small text-body-secondary text-center pt-3 w-100">Desarrollado por<br><strong>Mtro. Raúl Dionicio</strong></div></div>
    </aside>
    <main class="flex-grow-1 p-3 p-lg-4" style="min-width:0"><div id="contenido"></div></main>
  </div>
</section>

<!-- Modal reutilizable -->
<div class="modal fade" id="mdl" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable" id="mdlDlg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="mdlTitulo"></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
    <div class="modal-body" id="mdlCuerpo"></div>
    <div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal" id="mdlCancel">Cancelar</button><button class="btn btn-primary" id="mdlOk">Guardar</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================ UTILIDADES ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fx = v => { const n = Math.round(Number(v) * 100) / 100; return String(n); };            // 8 | 8.5 | 8.25
const f1 = v => (Math.round((Number(v) + 1e-9) * 10) / 10).toFixed(1);
const TRIM = ['Primer', 'Segundo', 'Tercer'], PARC = ['Primer', 'Segundo'];
const S = { token: null, user: null, perm: {}, cfg: {}, logo: '', clases: [], ctx: { claseId: '', t: 1, p: 1 }, mod: 'inicio', timer: null,
            as: { pend: {}, ver: 0, fecha: '' }, ac: { pend: {} }, es: {}, rp: { tipo: 'formativa' } };
const MODS = {};
let ocupado = 0;

function cargando(d) { ocupado = Math.max(0, ocupado + d); $('#barra').style.display = ocupado ? 'block' : 'none'; }
function toast(msg, tipo = 'success') {
  const e = document.createElement('div');
  e.className = 'toast align-items-center text-bg-' + tipo + ' border-0'; e.setAttribute('role', 'alert');
  e.innerHTML = '<div class="d-flex"><div class="toast-body">' + esc(msg) + '</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button></div>';
  $('#toasts').appendChild(e);
  e.addEventListener('hidden.bs.toast', () => e.remove());
  new bootstrap.Toast(e, { delay: tipo === 'danger' ? 6000 : 3000 }).show();
}
window.addEventListener('unhandledrejection', ev => { toast((ev.reason && ev.reason.message) || 'Ocurrió un error.', 'danger'); });

/** Llamada al servidor (personal autenticado). */
function llamar(accion, datos, silencioso) {
  return new Promise((res, rej) => {
    if (!silencioso) cargando(1);
    google.script.run
      .withSuccessHandler(r => {
        if (!silencioso) cargando(-1);
        if (r && r.ok) return res(r.data);
        if (r && r.sesion) { toast('Tu sesión expiró. Inicia sesión de nuevo.', 'warning'); salir(true); }
        rej(new Error(r ? r.error : 'Sin respuesta del servidor.'));
      })
      .withFailureHandler(e => { if (!silencioso) cargando(-1); rej(new Error(e.message || 'Error de comunicación.')); })
      .api(S.token, accion, datos || {});
  });
}
/** Llamada a funciones públicas (login, invitado). */
const pub = (fn, ...a) => new Promise((res, rej) => {
  cargando(1);
  google.script.run.withSuccessHandler(r => { cargando(-1); res(r); })
    .withFailureHandler(e => { cargando(-1); rej(new Error(e.message || 'Error de comunicación.')); })[fn](...a);
});

/* ---------- Tema claro / oscuro ---------- */
function setTema(t) {
  document.documentElement.setAttribute('data-bs-theme', t);
  try { localStorage.setItem('tema', t); } catch (e) {}
  $$('.ico-tema').forEach(i => i.className = 'ico-tema bi bi-' + (t === 'dark' ? 'sun-fill' : 'moon-stars-fill'));
}
const alternarTema = () => setTema(document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
(function () {
  let t = null; try { t = localStorage.getItem('tema'); } catch (e) {}
  if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-bs-theme', t);
})();

/* ---------- Modal ---------- */
let mdl = null;
function modal(o) {
  const el = $('#mdl');
  if (mdl) { try { mdl.dispose(); } catch (e) {} }
  $('#mdlTitulo').textContent = o.titulo;
  $('#mdlCuerpo').innerHTML = o.cuerpo;
  $('#mdlDlg').className = 'modal-dialog modal-dialog-scrollable ' + (o.size || '');
  const b = $('#mdlOk');
  b.className = 'btn btn-' + (o.okClase || 'primary'); b.textContent = o.ok || 'Guardar'; b.style.display = o.onOk ? '' : 'none'; b.disabled = false;
  $('#mdlCancel').textContent = o.onOk ? 'Cancelar' : 'Cerrar'; $('#mdlCancel').style.display = '';
  mdl = new bootstrap.Modal(el, { backdrop: o.estatico ? 'static' : true, keyboard: !o.estatico });
  b.onclick = async () => {
    b.disabled = true;
    try { const r = await o.onOk(); if (r !== false) mdl.hide(); }
    catch (e) { toast(e.message, 'danger'); }
    finally { b.disabled = false; }
  };
  mdl.show();
}
function confirmar(msg, btn = 'Eliminar') {
  return new Promise(res => {
    let si = false;
    modal({ titulo: 'Confirmar', cuerpo: '<p class="mb-0">' + esc(msg) + '</p>', ok: btn, okClase: 'danger', onOk: () => { si = true; } });
    $('#mdl').addEventListener('hidden.bs.modal', () => res(si), { once: true });
  });
}
const fCampo = (id, lbl, v = '', t = 'text', x = '') => '<div class="mb-3"><label class="form-label" for="' + id + '">' + lbl + '</label><input id="' + id + '" type="' + t + '" class="form-control" value="' + esc(v) + '" ' + x + '></div>';
const fSel = (id, lbl, opts, v) => '<div class="mb-3"><label class="form-label" for="' + id + '">' + lbl + '</label><select id="' + id + '" class="form-select">' +
  opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select></div>';
const fSwitch = (id, lbl, on) => '<div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><label class="form-check-label" for="' + id + '">' + lbl + '</label></div>';
const val = id => $('#' + id).value.trim();
const render = h => { $('#contenido').innerHTML = h; window.scrollTo(0, 0); };
const spinner = () => '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>';
const badgeAct = a => a ? '<span class="badge text-bg-success">Activo</span>' : '<span class="badge text-bg-secondary">Inactivo</span>';
const btnIco = (cls, ico, fn, tit) => '<button class="btn btn-sm btn-outline-' + cls + '" onclick="' + fn + '" title="' + tit + '" aria-label="' + tit + '"><i class="bi bi-' + ico + '"></i></button>';
const claseTxt = c => c.Asignatura + ' · ' + c.Grado + ' ' + c.Grupo;
const hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fechaDe = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fechaCorta = iso => fechaDe(iso).toLocaleDateString('es-MX', { weekday: 'short', day: '2-digit', month: '2-digit' });
const fechaLarga = iso => fechaDe(iso).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const sumaDias = (iso, n) => { const d = fechaDe(iso); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const colorCal = v => v == null ? 'secondary' : v < 6 ? 'danger' : v < 8 ? 'warning' : 'success';

/* ============================ ACCESO ============================ */
(async function inicio() {
  setTema(document.documentElement.getAttribute('data-bs-theme'));
  try {
    const d = await pub('infoPublica');
    $('#loginInst').textContent = d.institucion || d.titulo;
    $('#loginEnc').textContent = d.encabezado2 || d.titulo;
    if (d.logo) { const i = $('#loginLogo'); i.src = d.logo; i.style.display = 'inline-block'; }
  } catch (e) {}
})();

async function entrar(ev) {
  ev.preventDefault();
  const err = $('#loginErr'), b = $('#btnLogin'); err.classList.add('d-none'); b.disabled = true;
  try {
    const r = await pub('login', $('#lu').value, $('#lp').value);
    if (!r.ok) { err.textContent = r.error; err.classList.remove('d-none'); return; }
    S.token = r.data.token; $('#lp').value = '';
    await iniciarApp();
  } catch (e) { err.textContent = e.message; err.classList.remove('d-none'); }
  finally { b.disabled = false; }
}

async function iniciarApp() {
  const d = await llamar('init');
  Object.assign(S, { user: d.usuario, perm: d.permisos, cfg: d.config, logo: d.logo, clases: d.clases });
  if (!S.clases.some(c => c.ClaseID === S.ctx.claseId)) S.ctx.claseId = S.clases.length ? S.clases[0].ClaseID : '';
  $('#viewLogin').style.display = 'none'; $('#viewApp').style.display = 'block';
  $('#navInst').textContent = S.cfg.INSTITUCION || 'Asistencia y Calificaciones';
  $('#navUser').textContent = S.user.nombre; $('#navRol').textContent = 'Rol: ' + S.user.rol;
  $('#menu').innerHTML = MENU.filter(m => !m[3] || S.perm[m[3]].ver).map(m =>
    '<a href="#" class="menu-link" data-m="' + m[0] + '" onclick="ir(\'' + m[0] + '\');return false"><i class="bi bi-' + m[1] + '"></i> ' + m[2] + '</a>').join('');
  ir('inicio');
  if (S.user.cambiarPass) formPass(true);
}

async function salir(silencioso) {
  try { await vaciarTodo(); } catch (e) {}
  if (S.token && !silencioso) { try { await llamar('salir', {}, true); } catch (e) {} }
  clearInterval(S.timer); S.token = null;
  $('#viewApp').style.display = 'none'; $('#viewLogin').style.display = 'flex';
  if (mdl) { try { mdl.hide(); } catch (e) {} }
}

function formPass(forzado) {
  modal({ titulo: forzado ? 'Debes cambiar tu contraseña' : 'Cambiar contraseña', estatico: forzado,
    cuerpo: (forzado ? '<div class="alert alert-warning py-2">Por seguridad, define una contraseña personal antes de continuar.</div>' : '') +
      fCampo('f_pa', 'Contraseña actual', '', 'password', 'autocomplete="current-password"') +
      fCampo('f_pn', 'Nueva contraseña (mínimo 8 caracteres)', '', 'password', 'autocomplete="new-password"') +
      fCampo('f_pc', 'Confirmar nueva contraseña', '', 'password', 'autocomplete="new-password"'),
    onOk: async () => {
      if ($('#f_pn').value !== $('#f_pc').value) throw new Error('La confirmación no coincide.');
      await llamar('cuenta.password', { actual: $('#f_pa').value, nueva: $('#f_pn').value });
      S.user.cambiarPass = false; toast('Contraseña actualizada');
    } });
  if (forzado) $('#mdlCancel').style.display = 'none'; else $('#mdlCancel').style.display = '';
}
function acerca() {
  modal({ titulo: 'Acerca del sistema', cuerpo: '<p><strong>Sistema de Asistencia y Calificaciones</strong></p><p class="mb-1">Base de datos: Google Sheets · Plataforma: Google Apps Script</p><p class="mb-0">Desarrollador: <strong>Mtro. Raúl Dionicio</strong></p>' });
}

/* ============================ MENÚ / NAVEGACIÓN ============================ */
const MENU = [['inicio', 'house', 'Inicio', null], ['docentes', 'person-badge', 'Docentes y asignaturas', 'docentes'],
  ['estudiantes', 'people', 'Estudiantes', 'estudiantes'], ['asistencia', 'calendar-check', 'Asistencia', 'asistencia'],
  ['actividades', 'journal-check', 'Actividades y calificaciones', 'actividades'], ['reportes', 'file-earmark-text', 'Reportes', 'reportes'],
  ['usuarios', 'person-gear', 'Usuarios', 'usuarios'], ['permisos', 'shield-lock', 'Permisos', 'permisos'], ['config', 'gear', 'Configuración', 'config']];

async function vaciarTodo() { if (typeof vaciarAs === 'function') await vaciarAs(); if (typeof guardarAc === 'function') await guardarAc(); }

async function ir(m) {
  try { await vaciarTodo(); } catch (e) { toast(e.message, 'danger'); }
  clearInterval(S.timer); S.timer = null; S.mod = m;
  $$('#menu .menu-link').forEach(a => a.classList.toggle('active', a.dataset.m === m));
  const oc = bootstrap.Offcanvas.getInstance($('#sidebar')); if (oc) oc.hide();
  render(spinner());
  try { await MODS[m](); } catch (e) { render('<div class="alert alert-danger">' + esc(e.message) + '</div>'); }
}

/** Barra de contexto: asignatura/grupo, trimestre y parcial. */
function barraCtx() {
  if (!S.clases.length) return '<div class="alert alert-warning"><i class="bi bi-exclamation-triangle"></i> No tienes asignaturas asignadas. Registra una en <strong>Docentes y asignaturas</strong>.</div>';
  const c = S.ctx;
  return '<div class="card mb-3"><div class="card-body py-2"><div class="row g-2">' +
    '<div class="col-12 col-md-6"><label class="form-label small mb-0" for="cx_c">Asignatura · grado y grupo</label><select id="cx_c" class="form-select form-select-sm">' +
    S.clases.map(x => '<option value="' + x.ClaseID + '"' + (x.ClaseID === c.claseId ? ' selected' : '') + '>' + esc(claseTxt(x) + (S.user.rol === 'ADMIN' && x.Docente ? ' — ' + x.Docente : '')) + '</option>').join('') + '</select></div>' +
    '<div class="col-6 col-md-3"><label class="form-label small mb-0" for="cx_t">Trimestre</label><select id="cx_t" class="form-select form-select-sm">' +
    TRIM.map((n, i) => '<option value="' + (i + 1) + '"' + (c.t === i + 1 ? ' selected' : '') + '>' + n + ' trimestre</option>').join('') + '</select></div>' +

/* ============================ ASISTENCIA (tiempo real) ============================ */
MODS.asistencia = async () => {
  if (!S.clases.length) return render(barraCtx());
  if (!S.as.fecha) S.as.fecha = hoyISO();
  S.as.pend = {};
  render(barraCtx() + '<div id="asBody">' + spinner() + '</div>'); bindCtx();
  await cargarAs(true);
  S.timer = setInterval(() => { if (!Object.keys(S.as.pend).length && !document.hidden) cargarAs(false).catch(() => {}); }, 15000);
};
async function cargarAs(primera) {
  const ver = S.as.ver, f = S.as.fecha;
  const d = await llamar('asistencia.cargar', Object.assign(ctxP(), { Fecha: f }), !primera);
  if (S.mod !== 'asistencia' || ver !== S.as.ver || f !== S.as.fecha) return;
  S.as.data = d; pintarAs();
  if (primera && !d.periodo && S.perm.asistencia.editar) formPeriodo(null);
}
function pintarAs() {
  const d = S.as.data, P = S.perm.asistencia, f = S.as.fecha;
  $('#asBody').innerHTML =
    '<div class="card mb-3"><div class="card-body">' +
    '<div class="row g-2 align-items-end"><div class="col-12 col-md-5"><label class="form-label small mb-0" for="as_f">Fecha de la sesión</label>' +

    '<span class="badge text-bg-primary fs-6">Asistencias para evaluación: ' + (d.periodo ? d.total : '—') + '</span>' +
    (P.editar ? '<button class="btn btn-sm btn-outline-primary" onclick="formPeriodo(S.as.data.periodo)"><i class="bi bi-sliders"></i> ' + (d.periodo ? 'Configurar' : 'Definir') + '</button>' : '') +
    '<span class="badge text-bg-secondary">Sesiones registradas: ' + d.fechas.length + '</span></div></div></div>' +
    '<div class="small text-body-secondary mt-2 text-capitalize">' + esc(fechaLarga(f)) + '</div>' +
    (d.fechas.length ? '<div class="d-flex flex-wrap gap-1 mt-2">' + d.fechas.map(x => '<button class="btn btn-sm ' + (x === f ? 'btn-primary' : 'btn-outline-secondary') + '" onclick="irFecha(\'' + x + '\')">' + esc(fechaCorta(x)) + '</button>').join('') + '</div>' : '') +
    '</div></div>' +
    '<div class="card"><div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">' +
    '<div id="asResumen" class="d-flex gap-2 flex-wrap"></div><div class="d-flex gap-2 flex-wrap align-items-center"><span id="asEstado" class="small text-body-secondary"></span>' +
    (P.editar ? '<button class="btn btn-sm btn-success" onclick="marcarTodos(1)"><i class="bi bi-check2-all"></i> Todos presentes</button><button class="btn btn-sm btn-outline-secondary" onclick="marcarTodos(\'\')">Limpiar</button>' : '') +
    (P.eliminar && d.fechas.indexOf(f) >= 0 ? '<button class="btn btn-sm btn-outline-danger" onclick="borrarFecha()"><i class="bi bi-trash"></i></button>' : '') + '</div></div>' +
    '<div class="card-body border-bottom py-2"><input id="as_q" class="form-control form-control-sm" placeholder="Buscar estudiante…"></div>' +
    '<div id="asLista" class="list-group list-group-flush"></div></div>';
  $('#as_f').onchange = e => irFecha(e.target.value);

function pintarListaAs() {
  const d = S.as.data, P = S.perm.asistencia, q = ($('#as_q') ? $('#as_q').value : '').toLowerCase(); let a = 0, b = 0;
  d.estudiantes.forEach(e => { const v = d.marcas[e.EstID]; if (v === 1) a++; else if (v === 0) b++; });
  $('#asResumen').innerHTML = '<span class="badge text-bg-success">Presentes ' + a + '</span><span class="badge text-bg-danger">Faltas ' + b + '</span><span class="badge text-bg-secondary">Sin marcar ' + (d.estudiantes.length - a - b) + '</span>';
  $('#asLista').innerHTML = d.estudiantes.filter(e => !q || e.Nombre.toLowerCase().includes(q)).map(e => {
    const v = d.marcas[e.EstID], r = d.resumen[e.EstID] || { p: 0, f: 0, pct: 0 };
    return '<div class="list-group-item d-flex align-items-center gap-2 as-row"><span class="badge text-bg-secondary">' + e.NumLista + '</span>' +
      '<div class="flex-grow-1" style="min-width:0"><div class="fw-semibold text-truncate">' + esc(e.Nombre) + (e.Etiqueta ? ' <span class="badge text-bg-light border">' + esc(e.Etiqueta) + '</span>' : '') + '</div>' +
      '<small class="text-body-secondary">' + r.p + ' asist. · ' + r.f + ' faltas · ' + Math.round(r.pct) + '%</small></div>' +
      '<div class="btn-group"><button class="btn btn-' + (v === 1 ? '' : 'outline-') + 'success" ' + (P.editar ? '' : 'disabled') + ' onclick="marcar(\'' + e.EstID + '\',1)" aria-label="Presente"><i class="bi bi-check-lg"></i><span class="d-none d-sm-inline"> Presente</span></button>' +
      '<button class="btn btn-' + (v === 0 ? '' : 'outline-') + 'danger" ' + (P.editar ? '' : 'disabled') + ' onclick="marcar(\'' + e.EstID + '\',0)" aria-label="Falta"><i class="bi bi-x-lg"></i><span class="d-none d-sm-inline"> Falta</span></button></div></div>';
  }).join('') || '<div class="list-group-item text-center text-body-secondary py-4">No hay estudiantes en este grupo.</div>';
}
function ajustarResumen(id, ant, nuevo) {
  const d = S.as.data, r = d.resumen[id] || (d.resumen[id] = { p: 0, f: 0, pct: 0 });
  if (ant === 1) r.p--; if (ant === 0) r.f--; if (nuevo === 1) r.p++; if (nuevo === 0) r.f++;
  r.pct = d.total ? Math.min(100, r.p / d.total * 100) : 0;
}
function marcar(id, v) {
  if (!S.as.data.periodo) { toast('Primero define el número de asistencias para evaluación.', 'warning'); return; }
  const m = S.as.data.marcas, ant = m[id], nuevo = ant === v ? '' : v;
  ajustarResumen(id, ant, nuevo);
  if (nuevo === '') delete m[id]; else m[id] = nuevo;
  S.as.pend[id] = nuevo; S.as.ver++;
  pintarListaAs(); estadoAs('Guardando…');
  clearTimeout(S.as.t); S.as.t = setTimeout(vaciarAs, 350);

      '<td class="fw-semibold" data-c="L"></td><td class="fw-bold" data-c="G"></td>' +
      '<td><input type="text" maxlength="300" class="form-control form-control-sm obs" value="' + esc(f.obs) + '" ' + (P.editar ? '' : 'disabled') + '></td></tr>').join('') +
    '</tbody></table></div>' +
    '<p class="nota text-body-secondary mt-2">Calif. general = (asistencia + generales + libreta) ÷ 10. Libreta = suma de actividades × puntos de libreta ÷ suma de máximos.</p>';
  const t = $('#acTabla');

    if (i.classList.contains('calif')) {
      const bad = i.value !== '' && (+i.value < 0 || +i.value > +i.max); i.classList.toggle('is-invalid', bad);
      recalcFila(tr); if (!bad) encolarAc(tr.dataset.e, i.dataset.a, i.value);

  });

function recalcFila(tr) {
  const d = S.ac.d, f = d.filas.find(x => x.EstID === tr.dataset.e); let sg = 0, sl = 0;
  $$('input.calif', tr).forEach(i => {
    const a = d.acts.find(x => x.ActID === i.dataset.a); let v = parseFloat(i.value); if (isNaN(v)) v = 0; v = Math.max(0, Math.min(a.Max, v));
    if (a.Categoria === 'GENERAL') sg += v; else sl += v;
  });
  const pl = d.maxLib > 0 ? sl * d.pesoLib / d.maxLib : 0, g = (f.ptsAsis + sg + pl) / 10;
  $('[data-c=L]', tr).textContent = fx(pl);
  const c = $('[data-c=G]', tr); c.textContent = f1(g); c.className = 'fw-bold text-' + (g < 6 ? 'danger' : 'success');
}
function encolarAc(e, a, v) {

  } catch (e) {

  const d = S.us = await llamar('usuarios.listar'), P = S.perm.usuarios, nom = {}; d.docentes.forEach(x => nom[x.DocenteID] = x.Nombre);
  render('<h2 class="h4 mb-3"><i class="bi bi-person-gear"></i> Usuarios</h2>' + (P.crear ? '<button class="btn btn-primary mb-3" onclick="formUsuario()"><i class="bi bi-plus-lg"></i> Nuevo usuario</button>' : '') +
    '<div class="table-responsive card"><table class="table table-hover align-middle mb-0"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th class="d-none d-md-table-cell">Docente vinculado</th><th>Estado</th><th></th></tr></thead><tbody>' +
    d.usuarios.map(u => '<tr><td><code>' + esc(u.Usuario) + '</code></td><td>' + esc(u.Nombre) + '</td><td><span class="badge text-bg-' + (u.Rol === 'ADMIN' ? 'danger' : 'primary') + '">' + esc(u.Rol) + '</span></td><td class="d-none d-md-table-cell">' + esc(u.DocenteID === '*' ? 'Todos' : nom[u.DocenteID] || '—') + '</td><td>' + badgeAct(u.Activo) + '</td><td class="text-end text-nowrap">' +
      (P.editar ? btnIco('primary', 'pencil', "formUsuario('" + esc(u.Usuario) + "')", 'Editar') : '') + ' ' + (P.eliminar ? btnIco('danger', 'trash', "delUsuario('" + esc(u.Usuario) + "')", 'Eliminar') : '') + '</td></tr>').join('') + '</tbody></table></div>');
};
function formUsuario(id) {
  const d = S.us, u = id ? d.usuarios.find(x => x.Usuario === id) : { Activo: true, Rol: 'DOCENTE' };
  modal({ titulo: id ? 'Editar usuario' : 'Nuevo usuario',
    cuerpo: fCampo('f_u', 'Usuario', u.Usuario, 'text', id ? 'readonly' : 'autocapitalize="none"') + fCampo('f_n', 'Nombre', u.Nombre) +
      fSel('f_r', 'Rol', d.roles.map(r => [r, r]), u.Rol) + fSel('f_d', 'Docente vinculado (define qué grupos ve)', [['', '— Ninguno —']].concat(d.docentes.map(x => [x.DocenteID, x.Nombre])), u.DocenteID) +
      fCampo('f_p', id ? 'Nueva contraseña (dejar vacío para no cambiar)' : 'Contraseña inicial (mínimo 8 caracteres)', '', 'password', 'autocomplete="new-password"') +
      fSwitch('f_a', 'Activo', u.Activo) + '<div class="form-text">Con contraseña nueva, el usuario deberá cambiarla en su primer acceso. El rol ADMIN ve todos los grupos.</div>',
    onOk: async () => { await llamar('usuarios.guardar', { nuevo: !id, Usuario: val('f_u'), Nombre: val('f_n'), Rol: val('f_r'), DocenteID: val('f_d'), Password: $('#f_p').value, Activo: $('#f_a').checked }); toast('Usuario guardado'); MODS.usuarios(); } });
}
async function delUsuario(id) {
  if (!await confirmar('¿Eliminar al usuario "' + id + '"?')) return;
  try { await llamar('usuarios.eliminar', { Usuario: id }); toast('Usuario eliminado'); MODS.usuarios(); } catch (e) { toast(e.message, 'danger'); }
}

/* ============================ PERMISOS ============================ */
MODS.permisos = async () => {
  const d = S.pm = await llamar('permisos.cargar'); if (!S.pm.rol || d.roles.indexOf(S.pm.rol) < 0) S.pm.rol = d.roles.find(r => r !== 'ADMIN') || 'ADMIN';
  pintarPermisos();
};
function pintarPermisos() {
  const d = S.pm, P = S.perm.permisos, rol = d.rol, adm = rol === 'ADMIN', m = d.matriz[rol], dis = (adm || !P.editar) ? 'disabled' : '';
  render('<h2 class="h4 mb-3"><i class="bi bi-shield-lock"></i> Gestión de permisos</h2><div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-end">' +
    '<div class="col-12 col-md-4"><label class="form-label small mb-0" for="pm_r">Rol</label><select id="pm_r" class="form-select">' + d.roles.map(r => '<option' + (r === rol ? ' selected' : '') + '>' + esc(r) + '</option>').join('') + '</select></div>' +
    '<div class="col-12 col-md-8 d-flex flex-wrap gap-2">' + (P.crear ? '<button class="btn btn-outline-primary" onclick="nuevoRol()"><i class="bi bi-plus-lg"></i> Nuevo rol</button>' : '') +
    (P.eliminar && !adm ? '<button class="btn btn-outline-danger" onclick="delRol()"><i class="bi bi-trash"></i> Eliminar rol</button>' : '') +
    (!adm && P.editar ? '<button class="btn btn-primary" onclick="guardarPermisos()"><i class="bi bi-save"></i> Guardar permisos</button>' : '') + '</div></div></div></div>' +
    (adm ? '<div class="alert alert-info">El rol <strong>ADMIN</strong> siempre tiene acceso total y no se puede modificar.</div>' : '') +
    '<div class="table-responsive card"><table class="table align-middle mb-0 text-center"><thead><tr><th class="text-start">Módulo</th><th>Ver</th><th>Crear</th><th>Editar</th><th>Eliminar</th></tr></thead><tbody>' +
    Object.keys(d.modulos).map(k => '<tr><td class="text-start">' + esc(d.modulos[k]) + '</td>' + ['ver', 'crear', 'editar', 'eliminar'].map(a =>
      '<td><input class="form-check-input pm-chk" type="checkbox" data-m="' + k + '" data-a="' + a + '" ' + (m[k][a] ? 'checked' : '') + ' ' + dis + ' aria-label="' + a + '"></td>').join('') + '</tr>').join('') + '</tbody></table></div>' +
    '<p class="nota text-body-secondary mt-2">Sin “Ver” el módulo no aparece en el menú. Los docentes solo acceden a los grupos de su docente vinculado.</p>');
  $('#pm_r').onchange = e => { S.pm.rol = e.target.value; pintarPermisos(); };
  $$('.pm-chk').forEach(c => c.onchange = () => { const mm = S.pm.matriz[S.pm.rol]; mm[c.dataset.m][c.dataset.a] = c.checked; if (c.dataset.a !== 'ver' && c.checked) { mm[c.dataset.m].ver = true; } if (c.dataset.a === 'ver' && !c.checked) { ['crear', 'editar', 'eliminar'].forEach(a => mm[c.dataset.m][a] = false); } pintarPermisos(); });
}
async function guardarPermisos() { try { await llamar('permisos.guardar', { rol: S.pm.rol, matriz: S.pm.matriz[S.pm.rol] }); toast('Permisos guardados'); } catch (e) { toast(e.message, 'danger'); } }
function nuevoRol() {
  modal({ titulo: 'Nuevo rol', cuerpo: fCampo('f_r', 'Nombre del rol (ej. COORDINADOR)', ''), ok: 'Crear', onOk: async () => {
    const r = val('f_r').toUpperCase(); const mm = {}; Object.keys(S.pm.modulos).forEach(k => mm[k] = { ver: k === 'reportes', crear: false, editar: false, eliminar: false });
    await llamar('permisos.guardar', { rol: r, matriz: mm }); toast('Rol creado'); S.pm.rol = r; MODS.permisos();
  } });
}
async function delRol() {
  if (!await confirmar('¿Eliminar el rol ' + S.pm.rol + '?')) return;
  try { await llamar('permisos.eliminarRol', { rol: S.pm.rol }); toast('Rol eliminado'); MODS.permisos(); } catch (e) { toast(e.message, 'danger'); }
}

/* ============================ CONFIGURACIÓN (encabezado y logotipo) ============================ */
MODS.config = async () => {
  const d = await llamar('config.cargar'), c = d.config, P = S.perm.config, dis = P.editar ? '' : 'disabled';
  render('<h2 class="h4 mb-3"><i class="bi bi-gear"></i> Encabezado y logotipo de los reportes</h2><div class="row g-3"><div class="col-12 col-lg-7"><div class="card"><div class="card-body">' +
    fCampo('c_i', 'Nombre de la institución', c.INSTITUCION, 'text', dis) + fCampo('c_e', 'Encabezado secundario (secretaría, subsistema…)', c.ENCABEZADO2, 'text', dis) +
    '<div class="row"><div class="col-6">' + fCampo('c_k', 'C.C.T.', c.CCT, 'text', dis) + '</div><div class="col-6">' + fCampo('c_c', 'Ciclo escolar', c.CICLO, 'text', dis) + '</div></div>' +
    fCampo('c_d', 'Nombre de quien firma como Dirección', c.DIRECTOR, 'text', dis) + (P.editar ? '<button class="btn btn-primary" onclick="guardarConfig()"><i class="bi bi-save"></i> Guardar</button>' : '') +
    '</div></div></div><div class="col-12 col-lg-5"><div class="card"><div class="card-body text-center"><h3 class="h6">Logotipo</h3>' +
    '<div class="border rounded p-3 mb-3 bg-white"><img id="cfgLogo" class="logo-img" alt="Sin logotipo" ' + (d.logo ? 'src="' + d.logo + '"' : 'style="display:none"') + '>' + (d.logo ? '' : '<div id="cfgSin" class="text-body-secondary small">Sin logotipo</div>') + '</div>' +
    (P.editar ? '<input type="file" id="cfgFile" accept="image/png,image/jpeg" class="form-control"><div class="form-text">PNG o JPG. Se ajusta automáticamente a un tamaño ligero.</div>' : '') +
    '</div></div></div></div>');
  const fi = $('#cfgFile'); if (fi) fi.onchange = subirLogo;
};
async function guardarConfig() {
  try { await llamar('config.guardar', { INSTITUCION: val('c_i'), ENCABEZADO2: val('c_e'), CCT: val('c_k'), CICLO: val('c_c'), DIRECTOR: val('c_d') });
    S.cfg = { INSTITUCION: val('c_i'), ENCABEZADO2: val('c_e'), CCT: val('c_k'), CICLO: val('c_c'), DIRECTOR: val('c_d') }; $('#navInst').textContent = S.cfg.INSTITUCION; toast('Configuración guardada'); } catch (e) { toast(e.message, 'danger'); }
}
function subirLogo(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = async () => {
    const k = Math.min(1, 300 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    const uri = cv.toDataURL('image/png');
    try { await llamar('config.logo', { dataUri: uri }); S.logo = uri; const i = $('#cfgLogo'); i.src = uri; i.style.display = 'inline-block'; const s = $('#cfgSin'); if (s) s.remove(); toast('Logotipo actualizado'); }
    catch (e) { toast(e.message, 'danger'); }
  };
  img.onerror = () => toast('No se pudo leer la imagen.', 'danger'); img.src = url;
}

/* ============================ MÓDULO INVITADO ============================ */
async function consultar(ev) {
  ev.preventDefault(); const err = $('#gErr'); err.classList.add('d-none');
  try {
    const r = await pub('consultaInvitado', $('#gm').value, $('#gc').value);
    if (!r.ok) { err.textContent = r.error; err.classList.remove('d-none'); return; }
    pintarInvitado(r.data); $('#gc').value = '';
    $('#viewLogin').style.display = 'none'; $('#viewGuest').style.display = 'block'; window.scrollTo(0, 0);
  } catch (e) { err.textContent = e.message; err.classList.remove('d-none'); }
}
function salirInvitado() { $('#viewGuest').style.display = 'none'; $('#viewLogin').style.display = 'flex'; $('#guestBody').innerHTML = ''; }
function pintarInvitado(d) {
  const nf = v => v == null ? '<span class="text-body-secondary">—</span>' : '<span class="fw-semibold text-' + (v < 6 ? 'danger' : 'body') + '">' + (Number.isInteger(v) ? v : f1(v)) + '</span>';
  const e = d.estudiante;
  $('#guestBody').innerHTML =
    '<div class="text-center mb-3">' + (d.logo ? '<img src="' + d.logo + '" class="logo-img mb-2" alt="Logotipo"><br>' : '') + '<h1 class="h4 mb-0">' + esc(d.institucion) + '</h1><div class="text-body-secondary">' + esc(d.encabezado2) + (d.cct ? ' · C.C.T. ' + esc(d.cct) : '') + '</div>' +
    '<div class="fw-semibold mt-2">CONSULTA DE CALIFICACIONES</div></div>' +
    '<div class="card mb-3 border-primary"><div class="card-body"><div class="row g-2"><div class="col-12 col-md-6"><div class="small text-body-secondary">Estudiante</div><div class="fs-5 fw-bold">' + esc(e.nombre) + '</div></div>' +
    '<div class="col-6 col-md-3"><div class="small text-body-secondary">Grado y grupo</div><div class="fw-semibold">' + esc(e.grado) + ' ' + esc(e.grupo) + '</div></div><div class="col-6 col-md-3"><div class="small text-body-secondary">Matrícula</div><div class="fw-semibold">' + esc(e.matricula) + '</div></div></div></div></div>' +
    (d.materias.map(m => '<div class="card mb-3 shadow-sm"><div class="card-header d-flex flex-wrap justify-content-between gap-2"><strong>' + esc(m.asignatura) + '</strong><span class="small text-body-secondary">' + esc(m.docente) + (m.ciclo ? ' · Ciclo ' + esc(m.ciclo) : '') + '</span></div>' +
      '<div class="table-responsive"><table class="table table-sm align-middle text-center mb-0"><thead><tr><th class="text-start">Trimestre</th><th>1er parcial</th><th>2do parcial</th><th>Calificación del trimestre</th></tr></thead><tbody>' +
      m.trim.map((t, i) => '<tr><td class="text-start">' + TRIM[i] + ' trimestre</td><td>' + nf(t.p[0]) + '</td><td>' + nf(t.p[1]) + '</td><td>' + (t.cal == null ? nf(null) : '<span class="badge fs-6 text-bg-' + colorCal(t.cal) + '">' + t.cal + '</span>') + '</td></tr>').join('') +
      '</tbody><tfoot><tr class="table-active"><td class="text-start fw-bold" colspan="2">Total de puntos: ' + (m.final == null ? '—' : m.total) + '</td><td class="text-end fw-bold" colspan="2">Calificación final: ' + (m.final == null ? '—' : '<span class="badge fs-6 text-bg-' + colorCal(m.final) + '">' + f1(m.final) + '</span>') + (m.provisional && m.final != null ? ' <small class="text-body-secondary">(parcial, ciclo en curso)</small>' : '') + '</td></tr></tfoot></table></div></div>').join('') ||
      '<div class="alert alert-info">Aún no hay asignaturas registradas para este grupo.</div>');
}
</script>
</body>
</html>
